name: yoyo Office Hour

on:
  schedule:
    - cron: '0 6,14,22 * * *'
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch: {}

concurrency:
  group: yoyo-office-hour
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  office-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'issues' || github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, 'Decision-Input:') }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.bot-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install || true

      - name: Run yoyo Office Hour
        uses: yologdev/yoyo-action@v1
        with:
          agent: office-hour
          args: ${{ github.event_name == 'issue_comment' && format('decision-discussion issue {0}', github.event.issue.number) || '' }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gh_token: ${{ steps.bot-token.outputs.token }}
