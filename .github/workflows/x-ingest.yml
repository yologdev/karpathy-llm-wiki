name: X mention ingest

# The @yoyoevolve autonomous loop. When a registered yopedia user *replies* to a
# tweet with the trigger phrase "@yoyoevolve yopedia", yoyo ingests what the
# REPLIED-TO (parent) tweet points to — its full long-form X **Article** (via the
# X API `article` field) and/or its external **links** — into that user's yoyo as
# scoped agent-knowledge. The "yopedia" trigger word keeps an incidental
# @yoyoevolve mention from being treated as a save command.
# It never ingests plain tweet text. A mention from a non-user hits a 404 and is
# skipped (no base fallback). Closes the loop in yopedia-concept.md / issue #21.
#
# Required config:
#   - secret X_BEARER_TOKEN          (X API v2 bearer; also used by research.yml)
#   - secret YOPEDIA_SERVICE_TOKEN   (the system write credential)
#   - optional var YOPEDIA_URL       (defaults to the production Worker URL)
#
# Dedup relies on idempotent ingest (re-ingesting the same URL attaches/no-ops —
# see addAgentLearningPage in src/lib/agents.ts), so we use an overlapping time
# window rather than persisting a cursor — stateless and simple for CI.

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: x-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll @yoyoevolve reply-mentions and ingest the parent tweet's article/links
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOPEDIA_SERVICE_TOKEN: ${{ secrets.YOPEDIA_SERVICE_TOKEN }}
          YOPEDIA_URL: ${{ vars.YOPEDIA_URL || 'https://yopedia.yuanhao-li.workers.dev' }}
        run: |
          cat > x-ingest.mjs <<'EOF'
          const X_BEARER = process.env.X_BEARER_TOKEN;
          const SERVICE = process.env.YOPEDIA_SERVICE_TOKEN;
          const BASE = process.env.YOPEDIA_URL;
          const HANDLE = "yoyoevolve";
          // Trigger word: only replies that say "@yoyoevolve yopedia ..." fire the
          // loop, so an incidental @yoyoevolve mention isn't treated as a command.
          const TRIGGER = "yopedia";

          // Graceful no-op when not configured — "nothing to ingest" is the happy path.
          if (!X_BEARER || !SERVICE) {
            console.log("X_BEARER_TOKEN or YOPEDIA_SERVICE_TOKEN not set — skipping.");
            process.exit(0);
          }

          // ASCII-only subset of src/lib/slugify.ts — sufficient because X
          // usernames are [A-Za-z0-9_] (no CJK/whitespace), so it matches
          // slugify() for all valid handles.
          const slug = (s) =>
            s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

          const SKIP_HOSTS = new Set(["x.com", "twitter.com", "t.co", "www.x.com", "www.twitter.com"]);
          const externalLinks = (tweet) =>
            (tweet.entities?.urls ?? [])
              .map((u) => u.expanded_url || u.url)
              .filter((u) => {
                try {
                  const { protocol, hostname } = new URL(u);
                  return /^https?:$/.test(protocol) && !SKIP_HOSTS.has(hostname);
                } catch {
                  return false;
                }
              });

          // Overlapping window (idempotent ingest dedups the overlap).
          const startTime = new Date(Date.now() - 7 * 3600 * 1000).toISOString();
          const q = encodeURIComponent(`@${HANDLE} ${TRIGGER} is:reply -is:retweet`);
          const url =
            `https://api.twitter.com/2/tweets/search/recent?query=${q}` +
            `&max_results=50&start_time=${startTime}` +
            `&expansions=referenced_tweets.id,author_id` +
            `&tweet.fields=entities,author_id,referenced_tweets,article,created_at` +
            `&user.fields=username`;

          let payload;
          try {
            const res = await fetch(url, { headers: { Authorization: `Bearer ${X_BEARER}` } });
            if (!res.ok) {
              const bodyText = await res.text();
              // A bad/revoked bearer is systemic (same token every run) → fail
              // loudly, like the yopedia-side token. Transient errors (429, 5xx)
              // just skip this run and retry next cron.
              if (res.status === 401 || res.status === 403) {
                console.error(`FATAL: X rejected the bearer token (${res.status}: ${bodyText}) — check X_BEARER_TOKEN. Aborting.`);
                process.exit(1);
              }
              console.warn(`X search failed (${res.status}: ${bodyText}) — transient, skipping this run.`);
              process.exit(0);
            }
            payload = await res.json();
          } catch (err) {
            console.warn("X unreachable — skipping this run:", err?.message ?? err);
            process.exit(0);
          }

          const mentions = payload.data ?? [];
          const userById = Object.fromEntries(
            (payload.includes?.users ?? []).map((u) => [u.id, u.username]),
          );
          const tweetById = Object.fromEntries(
            (payload.includes?.tweets ?? []).map((t) => [t.id, t]),
          );
          if (mentions.length === 0) {
            console.log("No new @yoyoevolve reply-mentions. Nothing to ingest.");
            process.exit(0);
          }

          let ingested = 0, skipped = 0, failed = 0;

          // POST one ingest job ({url} or {text,title}) to the user's yoyo.
          // Returns true on success, false on (recoverable) failure; aborts the
          // whole run on a systemic auth rejection.
          async function ingestInto(agentId, body, label) {
            const res = await fetch(`${BASE}/api/agents/${agentId}/ingest`, {
              method: "POST",
              headers: { Authorization: `Bearer ${SERVICE}`, "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            if (res.status === 200) {
              // 200 means it was ingested — tolerate a non-JSON body.
              const data = await res.json().catch(() => ({}));
              console.log(`✓ ${agentId}: ${label} → ${data.slug ?? "(ok)"}${data.deduped ? " (deduped)" : ""}`);
              return true;
            }
            if (res.status === 404) {
              console.log(`· ${agentId} is not a yopedia user — skipped (${label})`);
              return null; // not-a-user — skip, not a failure
            }
            if (res.status === 401 || res.status === 403) {
              // Same token every request → one rejection is systemic, not per-item.
              console.error(`FATAL: service token rejected (${res.status}) — check YOPEDIA_SERVICE_TOKEN. Aborting.`);
              process.exit(1);
            }
            console.warn(`! ${agentId}: ingest failed (${res.status}) (${label})`);
            return false;
          }

          for (const mention of mentions) {
            const handle = userById[mention.author_id];
            if (!handle) {
              console.warn(`! mention ${mention.id}: author not expanded by X — skipping`);
              skipped++; continue;
            }

            // The replied-to (parent) tweet — that's what we ingest from.
            const parentId = (mention.referenced_tweets ?? []).find((r) => r.type === "replied_to")?.id;
            const parent = parentId ? tweetById[parentId] : undefined;
            if (!parent) {
              // Distinct from "plain tweet": the parent was deleted/protected or
              // X didn't return it in includes.
              console.log(`· @${handle}: replied-to tweet unavailable — skipping`);
              skipped++; continue;
            }

            // Build ingest jobs: the parent's full Article (if any) + its external links.
            const jobs = [];
            const article = parent.article;
            if (article && (article.text || article.title)) {
              const title = article.title || `X Article (shared by @${handle})`;
              const body = article.text || title;
              jobs.push({ body: { text: body, title }, label: `article "${title}"` });
            } else if (article) {
              console.warn(`! @${handle}: parent has an 'article' field of an unexpected shape (no text/title) — skipping the article`);
            }
            for (const link of externalLinks(parent)) {
              jobs.push({ body: { url: link }, label: link });
            }
            if (jobs.length === 0) { skipped++; continue; } // nothing ingestable (e.g. plain tweet)

            const agentId = `${slug(handle)}--yoyo`;
            for (const job of jobs) {
              try {
                const ok = await ingestInto(agentId, job.body, job.label);
                if (ok === true) ingested++;
                else if (ok === null) { skipped++; break; } // not a user → skip the rest for this handle
                else failed++;
              } catch (err) {
                console.warn(`! ${agentId}: ${err?.message ?? err}`);
                failed++;
              }
            }
          }

          console.log(`Done: ${ingested} ingested, ${skipped} skipped, ${failed} failed (from ${mentions.length} mentions).`);

          // Loud failure when ingest attempts were made but none succeeded —
          // otherwise a dead loop (yopedia down / bad token) shows green forever.
          // Gate on attempts only: a skip (non-user / no content) is never
          // evidence ingestion is healthy, so it must not mask a real outage.
          if (ingested === 0 && failed > 0) {
            console.error(`All ${failed} ingest attempt(s) failed and nothing was ingested — likely an outage or bad token. Failing the run.`);
            process.exit(1);
          }
          EOF
          node x-ingest.mjs
