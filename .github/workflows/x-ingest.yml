name: X mention ingest

# The @yoyoevolve autonomous loop. Polls X for recent mentions of @yoyoevolve
# that contain a link, and — for each mention from a REGISTERED yopedia user —
# ingests the link into that user's yoyo as scoped agent-knowledge, using the
# system token. A mention from a non-user hits a 404 and is skipped (no base
# fallback). Closes the loop in yopedia-concept.md / issue #21.
#
# Required config:
#   - secret X_BEARER_TOKEN          (X API v2 bearer; already used by research.yml)
#   - secret YOPEDIA_SERVICE_TOKEN   (the system write credential)
#   - optional var YOPEDIA_URL       (defaults to the production Worker URL)
#
# Dedup is by idempotent ingest (re-ingesting the same URL attaches/no-ops), so
# we use an overlapping time window rather than persisting a cursor — simpler
# and stateless for CI.

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: x-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll @yoyoevolve mentions and ingest
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOPEDIA_SERVICE_TOKEN: ${{ secrets.YOPEDIA_SERVICE_TOKEN }}
          YOPEDIA_URL: ${{ vars.YOPEDIA_URL || 'https://yopedia.yuanhao-li.workers.dev' }}
        run: |
          cat > x-ingest.mjs <<'EOF'
          const X_BEARER = process.env.X_BEARER_TOKEN;
          const SERVICE = process.env.YOPEDIA_SERVICE_TOKEN;
          const BASE = process.env.YOPEDIA_URL;
          const HANDLE = "yoyoevolve";

          // Graceful no-op when not configured — "nothing to ingest" is the happy path.
          if (!X_BEARER || !SERVICE) {
            console.log("X_BEARER_TOKEN or YOPEDIA_SERVICE_TOKEN not set — skipping.");
            process.exit(0);
          }

          // Mirror src/lib/slugify.ts for ASCII X handles (usernames are [A-Za-z0-9_]).
          const slug = (s) =>
            s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

          // Overlapping window (idempotent ingest dedups the overlap).
          const startTime = new Date(Date.now() - 7 * 3600 * 1000).toISOString();
          const q = encodeURIComponent(`@${HANDLE} -is:retweet has:links`);
          const url =
            `https://api.twitter.com/2/tweets/search/recent?query=${q}` +
            `&max_results=50&start_time=${startTime}` +
            `&tweet.fields=entities,author_id,created_at&expansions=author_id&user.fields=username`;

          let payload;
          try {
            const res = await fetch(url, { headers: { Authorization: `Bearer ${X_BEARER}` } });
            if (!res.ok) {
              console.warn(`X search failed (${res.status}: ${await res.text()}) — skipping this run.`);
              process.exit(0);
            }
            payload = await res.json();
          } catch (err) {
            console.warn("X unreachable — skipping this run:", err?.message ?? err);
            process.exit(0);
          }

          const tweets = payload.data ?? [];
          const userById = Object.fromEntries(
            (payload.includes?.users ?? []).map((u) => [u.id, u.username]),
          );
          if (tweets.length === 0) {
            console.log("No new @yoyoevolve mentions with links. Nothing to ingest.");
            process.exit(0);
          }

          const SKIP_HOSTS = new Set(["x.com", "twitter.com", "t.co", "www.x.com", "www.twitter.com"]);
          let ingested = 0, skipped = 0, failed = 0;

          for (const tweet of tweets) {
            const handle = userById[tweet.author_id];
            if (!handle) { skipped++; continue; }

            // Pick the first real external link in the mention.
            const link = (tweet.entities?.urls ?? [])
              .map((u) => u.expanded_url || u.url)
              .find((u) => {
                try { return /^https?:$/.test(new URL(u).protocol) && !SKIP_HOSTS.has(new URL(u).hostname); }
                catch { return false; }
              });
            if (!link) { skipped++; continue; }

            const agentId = `${slug(handle)}--yoyo`;
            try {
              const res = await fetch(`${BASE}/api/agents/${agentId}/ingest`, {
                method: "POST",
                headers: { Authorization: `Bearer ${SERVICE}`, "Content-Type": "application/json" },
                body: JSON.stringify({ url: link }),
              });
              if (res.status === 200) {
                const { slug: pageSlug, deduped } = await res.json();
                console.log(`✓ @${handle} → ${agentId}: ${link} → ${pageSlug}${deduped ? " (deduped)" : ""}`);
                ingested++;
              } else if (res.status === 404) {
                console.log(`· @${handle} is not a yopedia user (${agentId} not found) — skipped`);
                skipped++;
              } else if (res.status === 401 || res.status === 403) {
                // The token is the SAME for every request, so a single rejection
                // is systemic (bad/rotated YOPEDIA_SERVICE_TOKEN), not per-mention.
                // Fail the run loudly rather than silently ingesting nothing.
                console.error(
                  `FATAL: service token rejected (${res.status}) — check YOPEDIA_SERVICE_TOKEN. Aborting.`,
                );
                process.exit(1);
              } else {
                console.warn(`! @${handle} → ${agentId}: ingest failed (${res.status})`);
                failed++;
              }
            } catch (err) {
              console.warn(`! @${handle} → ${agentId}: ${err?.message ?? err}`);
              failed++;
            }
          }

          console.log(`Done: ${ingested} ingested, ${skipped} skipped, ${failed} failed (of ${tweets.length}).`);

          // Loud failure when the whole batch failed for non-per-user reasons
          // (e.g. yopedia down / 5xx) — otherwise a dead loop shows green forever.
          if (failed > 0 && ingested === 0 && skipped === 0) {
            console.error(`All ${failed} attempts failed and nothing was ingested — likely an outage. Failing the run.`);
            process.exit(1);
          }
          EOF
          node x-ingest.mjs
