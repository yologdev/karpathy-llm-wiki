name: yoyo Architect

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 7,15,23 * * *'  # Three daily cycles after PM and Office Hour
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to analyze'
        required: false

concurrency:
  group: yoyo-architect
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  architect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'issues' && (github.event.label.name == 'needs-architecture' || github.event.label.name == 'agent-help-wanted') || github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, 'Ask-Architect:') }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.bot-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install || true

      - name: Configure git
        run: |
          git config user.name "yoyo[bot]"
          git config user.email "yoyo[bot]@users.noreply.github.com"

      - name: Run yoyo Architect
        uses: yologdev/yoyo-action@v1
        with:
          agent: architect
          args: ${{ github.event_name == 'issue_comment' && format('decision-discussion issue {0}', github.event.issue.number) || github.event_name == 'workflow_dispatch' && github.event.inputs.issue || github.event.issue.number || '' }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gh_token: ${{ steps.bot-token.outputs.token }}
